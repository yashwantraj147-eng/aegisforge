name: AegisForge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Safety Audit
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./backend
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend cli

      - name: Generate Benign Test Artifacts
        run: |
          python sandbox/sample_artifacts/generate_benign_samples.py

      - name: Run Pytest Test Suite with Coverage
        run: |
          python -m pytest backend/tests -v --cov=backend/app --cov-report=term-missing

      - name: Verify CLI Companion Tooling
        run: |
          python cli/aegisctl.py --help
          python cli/aegisctl.py demo

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  docker-compose-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Root Compose File
        run: docker compose config

      - name: Validate Sandbox Compose File
        run: docker compose -f sandbox/docker-compose.sandbox.yml config
