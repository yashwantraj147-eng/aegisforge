[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisforge-backend"
version = "1.0.0"
description = "AegisForge Purple-Team Cyber Range & Vulnerability Workbench Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AegisForge Core Team", email = "security@aegisforge.internal" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "capstone>=5.0.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "F401",  # unused imports in init files
    "F841",  # unused local variables
    "E701",  # multiple statements on one line (colon)
    "W291",  # trailing whitespace (used for markdown linebreaks)
    "W293",  # blank line contains whitespace
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
